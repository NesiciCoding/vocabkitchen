name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Skip CI for doc-only PRs (README, SKILL.md, etc.) — tests never read them.
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + plugin integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to SHA for supply-chain safety; Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: python -m ruff check .

      - name: Plugin integrity check
        # Guards the extension surface: every plugins/* dir must be registered
        # in the marketplace, ship a plugin.json, and have resolvable symlinks.
        run: |
          python - <<'EOF'
          import json, os, sys

          mp = json.load(open(".claude-plugin/marketplace.json"))
          registered = {p["name"] for p in mp["plugins"]}
          ok = True

          for name in sorted(os.listdir("plugins")):
              d = os.path.join("plugins", name)
              if not os.path.isdir(d):
                  continue
              if name not in registered:
                  print(f"plugin {name}: missing from .claude-plugin/marketplace.json")
                  ok = False
              if not os.path.isfile(os.path.join(d, ".claude-plugin", "plugin.json")):
                  print(f"plugin {name}: missing .claude-plugin/plugin.json")
                  ok = False
              for f in os.listdir(d):
                  p = os.path.join(d, f)
                  if os.path.islink(p) and not os.path.exists(p):
                      print(f"plugin {name}: broken symlink {f} -> {os.readlink(p)}")
                      ok = False

          sys.exit(0 if ok else 1)
          EOF

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # spaCy ships compiled wheels; the README recommends 3.11–3.13.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No pip cache in setup-python: the project is dependency-free by design
      # (no requirements.txt / pyproject.toml to hash). Instead we cache the
      # installed packages themselves (--target dir + PYTHONPATH) so repeat
      # runs skip both the ~150MB download AND the wheel unpacking, and the
      # pinned spacy/model versions keep runs deterministic.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache installed spaCy + model
        id: cache-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.python-version }}-v1

      # Bump the cache key's -v1 suffix when changing the pins below.
      - name: Install spaCy + English model (cache miss only)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          python -m pip install --target="$PWD/deps" spacy==3.8.15 click
          python -m pip install --target="$PWD/deps" https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Point PYTHONPATH at cached deps
        run: echo "PYTHONPATH=$PWD/deps" >> "$GITHUB_ENV"

      - name: vocab profiler tests
        run: python3 test_vocab_profile.py

      - name: grammar profiler tests
        run: python3 test_grammar_profile.py

      - name: text report tests
        run: python3 test_text_report.py

      - name: wordlist build check
        run: python3 build_wordlists.py --check
