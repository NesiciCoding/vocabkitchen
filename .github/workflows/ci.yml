name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-perf-baseline:
        description: 'Recompute and commit the perf baseline from this run (main only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + plugin integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to SHA for supply-chain safety; Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install ruff==0.16.2

      - name: ruff check
        run: python -m ruff check .

      - name: Analysis payload schema stays in sync
        # The report contract: the checked-in analysis.schema.json must be
        # byte-equal to analysis.payload_schema() (the test suites mirror
        # this), both CLIs must print it via --schema, and the version the
        # CLI ships must be the version a real payload carries.
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          import analysis

          checked_in = json.load(open("analysis.schema.json", encoding="utf-8"))
          assert checked_in == analysis.payload_schema(), (
              "analysis.schema.json drifted from analysis.payload_schema()")
          assert checked_in["version"] == analysis.SCHEMA_VERSION
          for script in ("text_report.py", "class_profile.py"):
              p = subprocess.run([sys.executable, script, "--schema"],
                                 capture_output=True, text=True)
              assert p.returncode == 0, p.stderr
              assert json.loads(p.stdout) == analysis.payload_schema(), script
          p = subprocess.run([sys.executable, "text_report.py", "--no-grammar"],
                             input="The cat sat on the mat.",
                             capture_output=True, text=True)
          assert p.returncode == 0, p.stderr
          assert json.loads(p.stdout)["schemaVersion"] == analysis.SCHEMA_VERSION
          print("analysis schema: in sync, --schema on both CLIs, version in payload")
          EOF

      - name: Plugin integrity check
        # Guards the extension surface: every plugins/* dir must be registered
        # in the marketplace, ship a plugin.json, and have resolvable symlinks.
        run: |
          python - <<'EOF'
          import json, os, sys

          mp = json.load(open(".claude-plugin/marketplace.json"))
          registered = {p["name"] for p in mp["plugins"]}
          ok = True

          for name in sorted(os.listdir("plugins")):
              d = os.path.join("plugins", name)
              if not os.path.isdir(d):
                  continue
              if name not in registered:
                  print(f"plugin {name}: missing from .claude-plugin/marketplace.json")
                  ok = False
              if not os.path.isfile(os.path.join(d, ".claude-plugin", "plugin.json")):
                  print(f"plugin {name}: missing .claude-plugin/plugin.json")
                  ok = False
              for f in os.listdir(d):
                  p = os.path.join(d, f)
                  if os.path.islink(p) and not os.path.exists(p):
                      print(f"plugin {name}: broken symlink {f} -> {os.readlink(p)}")
                      ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Skills stay flavour-consistent + plugin.json commands
        # Every plugin ships ONE skill in two deliberately different flavours:
        # a plugin-flavoured copy (the `cmd` command on PATH, bundled-path
        # references) in plugins/<name>/skills/, and a repo-flavoured copy
        # (checkout script, ../../../ links) in .claude/skills/. Both must
        # exist and each must carry its own markers — an accidental copy of
        # one over the other loses the destination's markers and fails here.
        # plugin.json must also declare the command the skill states, and
        # both SKILL.md copies must document the flags the CLI ships for that
        # skill (the plugin surface stays in step with the command line).
        run: |
          python - <<'EOF'
          import json, os, sys

          ok = True
          required_flags = {
              "class-profile": ["--gap-report", "--interleave",
                                "--new-words-per-reading", "--curriculum",
                                "--watch", "--cando", "--cando-diff",
                                "--cando-diff-sort", "--schema"],
              "text-report": ["--suggest", "--gap-report", "--watch",
                              "--curriculum", "--cambridge", "--cando",
                              "--schema"],
          }
          for name in sorted(os.listdir("plugins")):
              d = os.path.join("plugins", name)
              if not os.path.isdir(d):
                  continue

              # The plugin's bin/ declares exactly one command.
              bindir = os.path.join(d, "bin")
              if not os.path.isdir(bindir):
                  print(f"plugin {name}: missing bin/")
                  ok = False
                  continue
              bins = [f for f in os.listdir(bindir)
                      if os.path.isfile(os.path.join(bindir, f))]
              if len(bins) != 1:
                  print(f"plugin {name}: expected exactly one command in bin/, got {bins}")
                  ok = False
                  continue
              cmd = bins[0]

              # plugin.json must declare that command under commands[].
              manifest = json.load(open(os.path.join(d, ".claude-plugin", "plugin.json")))
              declared = [c["name"] for c in manifest.get("commands", [])]
              if declared != [cmd]:
                  print(f"plugin {name}: plugin.json commands {declared} != bin command {cmd}")
                  ok = False

              plugin_copy = os.path.join(d, "skills", name, "SKILL.md")
              local_copy = os.path.join(".claude", "skills", name, "SKILL.md")
              has_plugin, has_local = os.path.isfile(plugin_copy), os.path.isfile(local_copy)
              if has_plugin != has_local:
                  print(f"skill {name}: copies out of sync — plugin: {has_plugin}, "
                        f"repo-local: {has_local}")
                  ok = False
              if has_plugin:
                  plugin_md = open(plugin_copy, encoding="utf-8").read()
                  local_md = open(local_copy, encoding="utf-8").read()
                  # NOTE: keep the literal `$` and `{CLAUDE_PLUGIN_ROOT}` apart
                  # in this script — GitHub evaluates dollar-brace-brace
                  # expressions even inside run: blocks, so writing the two
                  # adjacent here would make the workflow file invalid.
                  marker = "${" + "CLAUDE_PLUGIN_ROOT}"
                  if (f"`{cmd}`" not in plugin_md
                          or marker not in plugin_md):
                      print(f"skill {name}: plugin copy not plugin-flavoured "
                            f"(wants `{cmd}` + {marker})")
                      ok = False
                  if "../../../" not in local_md:
                      print(f"skill {name}: repo-local copy not repo-flavoured "
                            "(wants ../../../ repo links)")
                      ok = False
                  if plugin_md == local_md:
                      print(f"skill {name}: copies are identical — they are "
                            "deliberately different flavours")
                      ok = False
                  for flag in required_flags.get(name, []):
                      if flag not in plugin_md or flag not in local_md:
                          print(f"skill {name}: {flag} missing from a SKILL.md copy "
                                "(the plugin surface must stay in step with the CLI)")
                          ok = False

          sys.exit(0 if ok else 1)
          EOF


  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # spaCy ships compiled wheels; the README recommends 3.11–3.13.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No pip cache in setup-python: the project is dependency-free by design
      # (no requirements.txt / pyproject.toml to hash). Instead we cache the
      # installed packages themselves (--target dir + PYTHONPATH) so repeat
      # runs skip both the ~150MB download AND the wheel unpacking, and the
      # pinned spacy/model versions keep runs deterministic.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache installed spaCy + model
        id: cache-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.python-version }}-v2

      # Bump the cache key's suffix when changing the pins below.
      - name: Install spaCy + English model (cache miss only)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          python -m pip install --target="$PWD/deps" spacy==3.8.15 click==8.4.2
          python -m pip install --target="$PWD/deps" https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Point PYTHONPATH at cached deps
        run: echo "PYTHONPATH=$PWD/deps" >> "$GITHUB_ENV"

      - name: vocab profiler tests
        run: python3 test_vocab_profile.py

      - name: grammar profiler tests
        run: python3 test_grammar_profile.py

      - name: text report tests
        run: python3 test_text_report.py

      - name: class profile tests
        run: python3 test_class_profile.py

      # Golden check of the batch CLI itself over the checked-in sample
      # folder (sample-readings/): asserts the CSV/JSON contract end to end —
      # one row per text, ranked by level, aggregate = sum of the rows — so
      # the folder path is exercised in CI, not just the unit suites.
      - name: class profile CLI golden check (sample-readings)
        run: |
          python - <<'EOF'
          import csv, io, json, os, shutil, subprocess, sys, tempfile
          import analysis  # the shared engine: SCHEMA_VERSION / payload_schema

          def run_cli(args, script="class_profile.py"):
              p = subprocess.run([sys.executable, script] + args,
                                 capture_output=True, text=True)
              return p.returncode, p.stdout, p.stderr

          files = sorted(f for f in os.listdir("sample-readings")
                         if not f.startswith(".")
                         and os.path.isfile(os.path.join("sample-readings", f)))

          # CSV summary: one row per text, the documented spreadsheet columns.
          rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                  "--no-grammar", "--format", "csv"])
          assert rc == 0, err
          rows = list(csv.reader(io.StringIO(out)))
          assert rows[0] == ["file", "total_words", "vocab_typical", "vocab_reached",
                             "grammar_typical", "grammar_reaches", "estimated_level",
                             "above_target_pct", "fits"], rows[0]
          assert len(rows) == 1 + len(files), len(rows)
          assert all(r[-1] in ("yes", "no") for r in rows[1:]), rows
          assert all(int(r[1]) >= 5 for r in rows[1:]), rows

          # JSON: nothing skipped, aggregate = sum of the rows, ranked by level
          # with the sample folder spanning the A1 → C2 gradient, and the
          # folder payload carries the versioned report contract.
          rc, out, err = run_cli(["--file", "sample-readings/", "--no-grammar"])
          assert rc == 0, err
          d = json.loads(out)
          assert d["schemaVersion"] == analysis.SCHEMA_VERSION, d["schemaVersion"]
          assert d["texts"] == len(files) and d["skipped"] == [], (d["texts"], d["skipped"])
          assert sum(r["totalWordCount"] for r in d["rows"]) == d["aggregate"]["totalWordCount"]
          levels = ["A1", "A2", "B1", "B2", "C1", "C2"]
          ranks = [levels.index(r["estimatedLevel"]) if r["estimatedLevel"] in levels else 99
                   for r in d["rows"]]
          assert ranks == sorted(ranks), [r["estimatedLevel"] for r in d["rows"]]
          assert ranks[0] == 0 and ranks[-1] == 5, ranks  # A1 ... C2 gradient

          # Grammar-enabled run (spaCy is installed in this job): every row
          # carries a real grammar typical/reaches range.
          rc, out, err = run_cli(["--file", "sample-readings/"])
          assert rc == 0, err
          d = json.loads(out)
          assert d["grammarError"] is None, d["grammarError"]
          assert all(r["grammar"] is not None for r in d["rows"]), d["rows"]
          assert all(r["grammar"]["typical"] in levels
                     and r["grammar"]["reaches"] in levels
                     for r in d["rows"]), [r["grammar"] for r in d["rows"]]

          # The single-text report contract (text_report.py --format json): the
          # same engine, so the payload carries schemaVersion + the per-
          # construction grammar pass/fail shape RubricMaker's linker consumes.
          rc, out, err = run_cli(["--file", os.path.join("sample-readings", files[0]),
                                  "--target-level", "B1", "--format", "json"],
                                 script="text_report.py")
          assert rc == 0, err
          tp = json.loads(out)
          assert tp["schemaVersion"] == analysis.SCHEMA_VERSION, tp["schemaVersion"]
          gc = tp["grammarCriteria"]
          assert gc is not None and gc["total"] == len(analysis.gp._CONSTRUCTIONS), gc
          assert gc["passedCount"] + gc["failedCount"] == gc["total"], gc
          assert all(c["status"] in ("used", "not used") and c["pass"] == (c["status"] == "used")
                     for c in gc["criteria"]), gc
          assert all(c["count"] >= 1 and isinstance(c["examples"], list)
                     for c in gc["criteria"] if c["pass"]), gc

          # Pre-teaching export: per-text decks + the combined class-wide deck
          # (named after the source folder) and its level-keyed index, in the
          # documented shapes. --no-enrich keeps it deterministic (no network).
          outdir = tempfile.mkdtemp(prefix="classprof-golden-")
          try:
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--export", "flashcards",
                                      "--no-enrich", "--output", outdir])
              assert rc == 0, err
              stems = [os.path.splitext(f)[0] for f in files]
              per_text = {f"{s}-preteaching-B1-deck.csv" for s in stems}
              combined = "sample-readings-preteaching-B1-deck.csv"
              index_name = "sample-readings-preteaching-B1-index.md"
              assert set(os.listdir(outdir)) == per_text | {combined, index_name}, os.listdir(outdir)
              deck_rows = list(csv.reader(open(os.path.join(outdir, combined), encoding="utf-8")))
              assert deck_rows[0] == ["word", "definition", "example", "phonetic", "partOfSpeech"], deck_rows[0]
              assert len(deck_rows) > 1, deck_rows
              deck_words = {r[0] for r in deck_rows[1:]}
              assert len(deck_words) == len(deck_rows) - 1, "deck words are distinct"
              assert all(r[1] and r[1] == r[2] for r in deck_rows[1:]), "in-context backs under --no-enrich"
              index_md = open(os.path.join(outdir, index_name), encoding="utf-8").read()
              assert "| Word | Level | Occurrences | Texts |" in index_md, index_md
              idx_rows = [ln for ln in index_md.splitlines() if ln.startswith("| ")][1:]
              assert idx_rows, index_md
              idx_words = {}
              for ln in idx_rows:
                  cells = [c.strip() for c in ln.strip("|").split("|")]
                  word, lvl, occ, texts = cells[0], cells[1], cells[2], cells[3]
                  assert lvl in ("B2", "C1", "C2"), (word, lvl)  # strictly above B1
                  assert occ.isdigit() and int(occ) >= 1, (word, occ)
                  srcs = [t for t in texts.split(", ") if t]
                  assert all(t in files for t in srcs), (word, srcs)  # only real sources
                  idx_words[word] = lvl
              assert idx_words.keys() == deck_words, (sorted(idx_words), sorted(deck_words))
          finally:
              shutil.rmtree(outdir, ignore_errors=True)

          # Per-level combined decks: --targets A2,B1 writes one combined deck
          # + level-keyed index per level, no per-text decks, with B1-above a
          # subset of A2-above.
          outdir = tempfile.mkdtemp(prefix="classprof-golden-targets-")
          try:
              rc, out, err = run_cli(["--file", "sample-readings/", "--targets", "A2,B1",
                                      "--no-grammar", "--export", "flashcards",
                                      "--no-enrich", "--output", outdir])
              assert rc == 0, err
              base = "sample-readings-preteaching"
              assert set(os.listdir(outdir)) == {f"{base}-{lvl}-deck.csv"
                                                 for lvl in ("A2", "B1")} \
                                                 | {f"{base}-{lvl}-index.md"
                                                    for lvl in ("A2", "B1")}, os.listdir(outdir)
              def _deck_words(level):
                  rows = list(csv.reader(open(os.path.join(outdir, f"{base}-{level}-deck.csv"),
                                              encoding="utf-8")))
                  assert rows[0] == ["word", "definition", "example", "phonetic", "partOfSpeech"], rows[0]
                  return {r[0] for r in rows[1:]}
              a2_words, b1_words = _deck_words("A2"), _deck_words("B1")
              assert a2_words and b1_words, (len(a2_words), len(b1_words))
              assert b1_words <= a2_words, (sorted(b1_words - a2_words))
              def _index_words(level, above):
                  md = open(os.path.join(outdir, f"{base}-{level}-index.md"),
                            encoding="utf-8").read()
                  assert f"# Vocabulary index — above {level}" in md, md
                  assert "| Word | Level | Occurrences | Texts |" in md, md
                  words = {}
                  for ln in [l for l in md.splitlines() if l.startswith("| ")][1:]:
                      cells = [c.strip() for c in ln.strip("|").split("|")]
                      word, lvl, occ, texts = cells[0], cells[1], cells[2], cells[3]
                      assert lvl in above, (word, lvl)
                      assert occ.isdigit() and int(occ) >= 1, (word, occ)
                      srcs = [t for t in texts.split(", ") if t]
                      assert all(t in files for t in srcs), (word, srcs)
                      words[word] = lvl
                  return words
              assert _index_words("A2", {"B1", "B2", "C1", "C2"}).keys() == a2_words
              assert _index_words("B1", {"B2", "C1", "C2"}).keys() == b1_words
              # --cando on the same run: each level also gets its own Can-Do
              # reference deck, with the demands measured against that level.
              rc, out, err = run_cli(["--file", "sample-readings/", "--targets", "A2,B1",
                                      "--no-grammar", "--cando", "--export", "flashcards",
                                      "--no-enrich", "--output", outdir])
              assert rc == 0, err
              assert {f"{base}-{lvl}-cando-deck.csv" for lvl in ("A2", "B1")} \
                     <= set(os.listdir(outdir)), os.listdir(outdir)
              for level, above_bands in (("A2", {"B1", "B2", "C1", "C2"}),
                                         ("B1", {"B2", "C1", "C2"})):
                  cdrows = list(csv.reader(open(
                      os.path.join(outdir, f"{base}-{level}-cando-deck.csv"),
                      encoding="utf-8")))
                  assert cdrows[0] == ["word", "definition", "example", "phonetic",
                                       "partOfSpeech"], cdrows[0]
                  assert len(cdrows) > 1, cdrows
                  assert all(r[0].split(" — ")[0] in above_bands
                             and r[0].endswith("demand") and r[4] == "cando"
                             and f"above the {level} target" in r[2]
                             for r in cdrows[1:]), cdrows
          finally:
              shutil.rmtree(outdir, ignore_errors=True)

          # Markdown export: per-text handouts plus one set-level summary
          # handout aggregating every text's verdict and the pooled distribution.
          outdir = tempfile.mkdtemp(prefix="classprof-golden-md-")
          try:
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--export", "md", "--output", outdir])
              assert rc == 0, err
              stems = [os.path.splitext(f)[0] for f in files]
              assert set(os.listdir(outdir)) == {f"{s}-preteaching-B1.md" for s in stems} \
                                                 | {"sample-readings-summary-B1.md"}, os.listdir(outdir)
              summary_md = open(os.path.join(outdir, "sample-readings-summary-B1.md"),
                                encoding="utf-8").read()
              assert f"# Set summary — Target B1 ({len(files)} texts)" in summary_md, summary_md
              assert "Aggregate vocabulary:" in summary_md, summary_md
              assert "| Text | Words |" in summary_md, summary_md
              assert all(f in summary_md for f in files), files  # every text in the table
              assert "pre-teach" in summary_md and "on level" in summary_md, summary_md
          finally:
              shutil.rmtree(outdir, ignore_errors=True)

          # Vocabulary export by band: one CSV per CEFR band (vocab-<band>.csv,
          # lowercase) with the documented word × occurrences × texts shape,
          # cross-checked against the JSON aggregate's per-band distinct counts.
          outdir = tempfile.mkdtemp(prefix="classprof-golden-vocab-")
          try:
              rc, out, err = run_cli(["--file", "sample-readings/", "--no-grammar",
                                      "--export-vocab", outdir])
              assert rc == 0, err
              agg = json.loads(out)["aggregate"]  # this run's own pooled distribution
              band_files = [f"vocab-{lvl.lower().replace(' ', '-')}.csv"
                            for lvl in levels + ["Off List"]]
              assert set(os.listdir(outdir)) == set(band_files), os.listdir(outdir)
              all_words = set()
              for fname in band_files:
                  rows = list(csv.reader(open(os.path.join(outdir, fname),
                                              encoding="utf-8")))
                  assert rows[0] == ["word", "occurrences", "texts"], (fname, rows[0])
                  assert len(rows) > 1, fname  # every band non-empty for the sample
                  words = set()
                  for r in rows[1:]:
                      word, occ, texts = r[0], int(r[1]), int(r[2])
                      assert word and occ >= 1 and 1 <= texts <= len(files) \
                          and occ >= texts, (fname, r)
                      assert word not in words, (fname, word)  # distinct within the band
                      words.add(word)
                  assert not (all_words & words), "bands overlap"
                  all_words |= words
              # The band exports are exactly the aggregate's per-level distinct
              # word counts from this very run.
              for lvl in levels + ["Off List"]:
                  fname = f"vocab-{lvl.lower().replace(' ', '-')}.csv"
                  rows = list(csv.reader(open(os.path.join(outdir, fname),
                                              encoding="utf-8")))
                  assert len(rows) - 1 == agg["levels"][lvl]["distinctWordCount"], \
                      (lvl, len(rows) - 1)
          finally:
              shutil.rmtree(outdir, ignore_errors=True)

          # Curriculum pass: --export csv --curriculum writes the folder-level
          # coverage grid — one row per text, one column per required item,
          # with a pass verdict per text, in the documented shape.
          outdir = tempfile.mkdtemp(prefix="classprof-golden-curriculum-")
          try:
              curr = os.path.join(outdir, "unit-checklist.txt")
              with open(curr, "w", encoding="utf-8") as f:
                  f.write("[vocabulary]\npurchase\nmat\n\n[grammar]\npassive_present\n")
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--export", "csv",
                                      "--curriculum", curr, "--output", outdir])
              assert rc == 0, err
              matrix = "sample-readings-curriculum-coverage-B1.csv"
              assert matrix in os.listdir(outdir), os.listdir(outdir)
              mrows = list(csv.reader(open(os.path.join(outdir, matrix),
                                           encoding="utf-8")))
              assert mrows[0] == ["text", "purchase", "mat", "Passive (present)", "pass"], mrows[0]
              assert len(mrows) == 1 + len(files), mrows  # one row per text
              assert all(r[0] in files for r in mrows[1:]), mrows
              assert all(c in ("yes", "no") for r in mrows[1:] for c in r[1:]), mrows
              # md run: per-text sections plus the same grid in the set summary.
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--export", "md",
                                      "--curriculum", curr, "--output", outdir])
              assert rc == 0, err
              summ_md = open(os.path.join(outdir, "sample-readings-summary-B1.md"),
                             encoding="utf-8").read()
              assert "## Curriculum coverage" in summ_md \
                     and "| Text | purchase | mat | Passive (present) | pass |" in summ_md \
                     and all(f in summ_md for f in files), summ_md
              with open(os.path.join(outdir, "academic-essay-preteaching-B1.md"),
                        encoding="utf-8") as f:
                  assert "## Curriculum checklist" in f.read()
              # json run: the same grid inside the payload (curriculumCoverage),
              # so scripts can consume the pass/fail matrix without CSV parsing.
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--format", "json",
                                      "--curriculum", curr])
              assert rc == 0, err
              ccj = json.loads(out)["curriculumCoverage"]
              assert ccj["items"] == [["vocabulary", "purchase"],
                                       ["vocabulary", "mat"],
                                       ["grammar", "Passive (present)"]], ccj["items"]
              assert ccj["textCount"] == len(files), ccj
              assert {r["text"] for r in ccj["rows"]} == set(files), ccj
              assert all(len(r["cells"]) == len(ccj["items"]) and isinstance(r["pass"], bool)
                         for r in ccj["rows"]), ccj
              assert 0 <= ccj["passCount"] <= ccj["textCount"], ccj
          finally:
              shutil.rmtree(outdir, ignore_errors=True)

          # Can-Do pass: --cando-diff --export md adds the shared above-target
          # demands to the summary handout, and --cando --export flashcards
          # writes a combined Can-Do reference deck in the RubricMaker shape.
          outdir = tempfile.mkdtemp(prefix="classprof-golden-cando-")
          try:
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--cando-diff", "--export", "md",
                                      "--output", outdir])
              assert rc == 0, err
              summ_md = open(os.path.join(outdir, "sample-readings-summary-B1.md"),
                             encoding="utf-8").read()
              assert "## Can-Do demands across the set" in summ_md, summ_md
              assert "| Demand | Level | Can-Do descriptor | Texts |" in summ_md, summ_md
              assert all(f in summ_md for f in files), summ_md
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--cando", "--export", "flashcards",
                                      "--no-enrich", "--output", outdir])
              assert rc == 0, err
              cdeck = "sample-readings-preteaching-B1-cando-deck.csv"
              assert cdeck in os.listdir(outdir), os.listdir(outdir)
              cdrows = list(csv.reader(open(os.path.join(outdir, cdeck),
                                            encoding="utf-8")))
              assert cdrows[0] == ["word", "definition", "example", "phonetic",
                                   "partOfSpeech"], cdrows[0]
              assert len(cdrows) > 1, cdrows
              assert all(r[0].endswith("demand") and r[3] == "" and r[4] == "cando"
                         for r in cdrows[1:]), cdrows
          finally:
              shutil.rmtree(outdir, ignore_errors=True)

          # Interleave pass: the spaced-introduction schedule across the set.
          # --interleave --export md writes the per-text handouts + summary
          # plus the <set>-interleave-<LEVEL>.md handout, and the run's own
          # JSON payload carries the schedule: one reading per text, at most
          # the budget of new words per reading, every scheduled word strictly
          # above the target, and the md word index == the payload index.
          outdir = tempfile.mkdtemp(prefix="classprof-golden-interleave-")
          try:
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--interleave",
                                      "--new-words-per-reading", "4",
                                      "--export", "md", "--output", outdir])
              assert rc == 0, err
              stems = [os.path.splitext(f)[0] for f in files]
              reading_files = [f"sample-readings-interleave-B1-reading-{i}.md"
                               for i in range(1, len(files) + 1)]
              assert set(os.listdir(outdir)) == {f"{s}-preteaching-B1.md" for s in stems} \
                                                 | {"sample-readings-summary-B1.md",
                                                    "sample-readings-interleave-B1.md"} \
                                                 | set(reading_files), os.listdir(outdir)
              il = json.loads(out)["interleave"]
              # one printable handout per reading: its Introduce/Review/Due
              # words, each with the in-text sentence it appears in.
              for i, r in enumerate(il["readings"], start=1):
                  rmd = open(os.path.join(outdir, reading_files[i - 1]),
                             encoding="utf-8").read()
                  assert f"# Reading {i} — {os.path.basename(r['file'])}" in rmd, rmd
                  assert "| Word | Level | Definition |" in rmd, rmd
                  assert "## Introduce" in rmd and "## Review" in rmd \
                         and "## Due for review" in rmd, rmd
                  for d in r["introduce"]:
                      assert f"`{d['word']}`" in rmd \
                             and f"| {d['level']} |" in rmd, (i, d)
              assert il["targetLevel"] == "B1" and il["budget"] == 4, il
              assert len(il["readings"]) == len(files), il  # one reading per text
              assert all(os.path.basename(r["file"]) in files for r in il["readings"]), il["readings"]
              assert [r["index"] for r in il["readings"]] == list(range(1, len(files) + 1)), il
              idx = {w["word"]: w for w in il["words"]}
              assert len(idx) == len(il["words"]), "schedule words are distinct"
              assert all(w["level"] in ("B2", "C1", "C2") for w in il["words"]), il["words"]
              assert all(1 <= w["introducedAt"] <= len(files) and w["appearsIn"]
                         and all(1 <= i <= len(files) for i in w["appearsIn"])
                         for w in il["words"]), il["words"]
              for r in il["readings"]:
                  assert len(r["introduce"]) <= il["budget"], r
                  for d in r["introduce"]:
                      assert d["word"] in idx, d
                      assert idx[d["word"]]["introducedAt"] == r["index"], d
                      assert idx[d["word"]]["level"] == d["level"], d
                  assert all(d["word"] in idx for d in r["due"]), r
              assert any(r["introduce"] for r in il["readings"]), il
              md = open(os.path.join(outdir, "sample-readings-interleave-B1.md"),
                        encoding="utf-8").read()
              assert (f"# Vocabulary interleaving — Target B1 ({len(files)} readings, "
                      f"4 new words/reading)") in md, md
              assert "## Reading 1 — " in md and f"## Reading {len(files)} — " in md, md
              assert "**Introduce" in md and "Due for review" in md, md
              assert "## Word index" in md \
                     and "| Word | Level | Introduced at | Appears in |" in md, md
              idx_rows = [ln for ln in md.splitlines() if ln.startswith("| `")]
              assert len(idx_rows) == len(il["words"]), (len(idx_rows), len(il["words"]))
              assert all(ln.split("|")[2].strip() in ("B2", "C1", "C2")
                         for ln in idx_rows), md
              # csv schedule: same words, deferral column consistent with payload.
              rc, out, err = run_cli(["--file", "sample-readings/", "--target-level", "B1",
                                      "--no-grammar", "--interleave",
                                      "--new-words-per-reading", "4",
                                      "--export", "csv", "--output", outdir])
              assert rc == 0, err
              csv_rows = list(csv.reader(open(os.path.join(outdir,
                                                           "sample-readings-interleave-B1.csv"),
                                              encoding="utf-8")))
              assert csv_rows[0] == ["word", "level", "introducedAt", "appearsIn", "deferredFrom"], csv_rows[0]
              assert len(csv_rows) - 1 == len(il["words"]), (len(csv_rows), len(il["words"]))
              for r in csv_rows[1:]:
                  word, lvl, at, seen, df = r
                  w = idx[word]
                  assert lvl == w["level"] and int(at) == w["introducedAt"], r
                  assert seen == ";".join(str(i) for i in w["appearsIn"]), r
                  assert df == "" or int(df) == w.get("deferredFrom"), r
          finally:
              shutil.rmtree(outdir, ignore_errors=True)

          print(f"golden check OK: {len(files)} texts profiled, ranked A1 to C2, exports shaped")
          EOF

      - name: wordlist build check
        run: python3 build_wordlists.py --check

      # One warm run of each suite, wall time to a per-version JSON. Runs
      # after the real test steps so failures surface there first; this is
      # purely for the perf-comparison job (regressions surface early).
      - name: Benchmark suites
        run: |
          python - <<'EOF'
          import json, subprocess, sys, time
          suites = ["test_vocab_profile.py", "test_grammar_profile.py", "test_text_report.py", "test_class_profile.py"]
          out = {}
          for s in suites:
              t0 = time.monotonic()
              r = subprocess.run([sys.executable, s], capture_output=True, text=True)
              out[s] = round(time.monotonic() - t0, 2)
              if r.returncode != 0:
                  print(r.stdout)
                  print(r.stderr)
                  sys.exit(r.returncode)
          with open(f"perf-{sys.version_info.major}.{sys.version_info.minor}.json", "w") as f:
              json.dump(out, f)
          print(json.dumps(out))
          EOF

      - name: Upload perf results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-${{ matrix.python-version }}
          path: perf-*.json
          if-no-files-found: error

  perf:
    name: Perf comparison
    # Baseline rewrites only from a manual dispatch on main; PRs always
    # compare (never rewrite).
    if: github.event_name == 'pull_request' || (github.event.inputs.update-perf-baseline == 'true' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: perf-artifacts
          pattern: perf-*
          merge-multiple: true

      # Compare this run's wall times against the committed baseline and
      # upsert a PR comment (marker-anchored, so it updates in place). When
      # run via workflow_dispatch with update-perf-baseline=true on main,
      # instead recomputes and commits the baseline from the measured values.
      - name: Compare / update baseline + comment
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASELINE: ${{ github.event.inputs.update-perf-baseline == 'true' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          baseline_path = ".github/perf-baseline.json"
          baseline = {}
          if os.path.exists(baseline_path):
              baseline = json.load(open(baseline_path))

          def _request(method, url, payload=None):
              req = urllib.request.Request(
                  f"https://api.github.com{url}", method=method,
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              data = json.dumps(payload).encode() if payload is not None else None
              with urllib.request.urlopen(req, data) as r:
                  return json.loads(r.read().decode()) if r.status != 204 else None

          def api(method, url, payload=None):
              return _request(method, url, payload)

          def api_paginated(url):
              # Follow Link headers across pages (the issue-comments endpoint
              # caps at 100 per page).
              out = []
              while url:
                  req = urllib.request.Request(
                      f"https://api.github.com{url}",
                      headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                               "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28"})
                  with urllib.request.urlopen(req) as r:
                      out += json.loads(r.read().decode())
                      link = r.headers.get("Link", "")
                  url = None
                  for part in link.split(","):
                      if 'rel="next"' in part:
                          url = part[part.index("<") + 1:part.index(">")]
                          url = url.replace("https://api.github.com", "")
                          break
              return out

          measured = {}
          for f in os.listdir("perf-artifacts"):
              if f.startswith("perf-") and f.endswith(".json"):
                  ver = f[5:-5]
                  measured[ver] = json.load(open(os.path.join("perf-artifacts", f)))

          if os.environ["UPDATE_BASELINE"] == "true":
              json.dump(measured, open(baseline_path, "w"), indent=2, sort_keys=True)
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", baseline_path], check=True)
              # git diff --cached --quiet exits 0 = no changes, 1 = changes
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                  print("baseline unchanged; nothing to commit")
              else:
                  subprocess.run(["git", "commit", "-m", "Update perf baseline"], check=True)
                  # persist-credentials is off, so push with an explicit token URL.
                  push_url = f"https://x-access-token:{os.environ['GH_TOKEN']}@github.com/{repo}.git"
                  subprocess.run(["git", "push", push_url, "HEAD:" + os.environ["GITHUB_REF_NAME"]], check=True)
                  print("baseline updated:", json.dumps(measured))
              # Token-initiated pushes don't trigger workflows (recursion
              # guard), so re-run CI via workflow_dispatch so the PR gets
              # fresh checks on the new commit.
              subprocess.run(["gh", "workflow", "run", "ci.yml", "--ref", os.environ["GITHUB_REF_NAME"]], check=True)
              print("re-triggered CI on", os.environ["GITHUB_REF_NAME"])
              sys.exit(0)

          pr = os.environ["PR_NUMBER"]
          if not pr:
              print("no PR number; skipping comment")
              sys.exit(0)

          # regression: >20% slower, with 0.5s headroom for runner noise
          rows = []
          regressed = 0
          for ver in sorted(measured):
              base = baseline.get(ver, {})
              for suite, t in sorted(measured[ver].items()):
                  b = base.get(suite)
                  if b is None:
                      rows.append((ver, suite, "—", f"{t:.1f}s", "(new)"))
                      continue
                  dt = t - b
                  if dt > 0.2 * b + 0.5:
                      regressed += 1
                      flag = "❗ slower"
                  elif dt < -0.2 * b - 0.5:
                      flag = "✅ faster"
                  else:
                      flag = "≈"
                  rows.append((ver, suite, f"{b:.1f}s", f"{t:.1f}s", flag))

          lines = ["<!-- vocabkitchen-perf -->",
                   "## ⏱ Suite timings (wall time per Python)", "",
                   "| Python | suite | baseline | this run | delta |",
                   "|---|---|---|---|---|"]
          lines += [f"| {v} | {s} | {b} | {t} | {f} |" for v, s, b, t, f in rows]
          if regressed:
              lines += ["", f"❗ **{regressed} suite(s) slower than baseline** — worth a look before merging."]
          else:
              lines += ["", "✅ All suites within baseline."]
          body = "\n".join(lines)

          comments = api_paginated(f"/repos/{repo}/issues/{pr}/comments?per_page=100")
          found = next((c for c in comments
                        if c.get("user", {}).get("login") == "github-actions[bot]"
                        and "vocabkitchen-perf" in c.get("body", "")), None)
          if found:
              api("PATCH", f"/repos/{repo}/issues/comments/{found['id']}", {"body": body})
              print("comment updated")
          else:
              api("POST", f"/repos/{repo}/issues/{pr}/comments", {"body": body})
              print("comment created")
          print(body)
          EOF
